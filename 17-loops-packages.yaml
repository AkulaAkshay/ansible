- name: loops
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: install multiple packages by using loops
    ansible.builtin.package:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop:
    -  {name: "nginx", state: "latest"}
    -  {name: "zip", state: "ansent"}
    -  {name: "mysql", state: "latest"}