#mostly we use ansible builtin functions, if we want to create our customized functions then we need to write python code because ansible is written in python.
#filters or functions --> basically if we provide an input , function or filter will filter the input and provides the output.
- name: functions
  hosts: local
  connection: local
  tasks:
  - name: default variable
    ansible.builtin.debug:
      msg: "Hello {{ name | default('RAMESH') }}"

#-------------------
- name: functions
  hosts: local
  connection: local
  vars:
    courses: ansible, linux, terraform, k8 #string
  tasks:
  - name: default variable
    ansible.builtin.debug:
      msg: " courses learnt are: {{ courses | split (',') }}" #split will convert the string to list based on a seperator in our case the seperator is ","

#--------------------------
- name: functions
  hosts: local
  connection: local
  vars:
    tags: #map or dictionary
      Application: Payment
      Environment: Dev
  tasks:
  - name: converting mao or dictionary into a list or items 
    ansible.builtin.debug:
      msg: "tags are: {{ tags | dict2items }}" #list or items --> []
#---------------------------
- name: functions
  hosts: local
  connection: local
  vars:
    ListTags:
    - key: Application
      value: Payment
    - key: Environment
      value: Dev
  tasks:
  - name: converting map to items
    ansible.builtin.debug:
      msg: "List of tags i.e., ListTags are: {{ ListTags | items2dict }} " #map or dictionary --> {}
#----------------------------
# till now we defined a variable at the start itself (in vars section) what if we want to define a variable in the middle i.e., (in the tasks section)
- name: functions
  hosts: local
  connection: local
  tasks:
  - name: read student.yaml file and taking that file into a variable student_yaml
    ansible.builtin.set_fact:
      student_yaml: "{{ lookup('file', 'student.yaml') | from_yaml }}"

  - name: convert yaml into json
    ansible.builtin.debug:
      msg: "into json format: {{ student_yaml | to_json}}"

  - name: save json to file
    ansible.builtin.copy:
     dest: ./student-data.json
     content: "{{ student_yaml | to_nice_json }}"
