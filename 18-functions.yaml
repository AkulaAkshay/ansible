#mostly we use ansible builtin functions, if we want to create our customized functions then we need to write python code because ansible is written in python.
- name: functions
  hosts: local
  connection: local
  tasks:
  - name: default variable
    ansible.builtin.debug:
      msg: "Hello {{ name | default('RAMESH') }}"

#-------------------
- name: functions
  hosts: local
  connection: local
  vars:
    courses: ansible, linux, terraform, k8 #string
  tasks:
  - name: default variable
    ansible.builtin.debug:
      msg: " courses learnt are: {{ courses | split (',') }}" #split will convert the string to list based on a seperator in our case the seperator is ","

#--------------------------
- name: functions
  hosts: local
  connection: local
  vars:
    tags: #map or dictionary
      Application: Payment
      Environment: Dev
  tasks:
  - name: converting mao or dictionary into a list or items
    ansible.builtin.debug:
      msg: "tags are: {{ tags | dict2items }}"
#---------------------------
- name: functions
  hosts: local
  connection: local
  vars:
    ListTags:
    - key: Application
      value: Payment
    - key: Environment
      value: Dev
  tasks:
  - name: converting map to items
    ansible.builtin.debug:
      msg: "List of tags i.e., ListTags are: {{ ListTags | items2map }} "