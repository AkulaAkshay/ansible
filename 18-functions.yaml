- name: functions
  hosts: local
  connection: local
  vars:
    name: "AKSHAY AKULA"
  tasks:
  - name: convert to lower case
    ansible.builtin.debug:
      msg: "convert into lower case: {{ name | lower }}"
#---------------------------
- name: functions
  hosts: local
  connection: local
  vars:
    institute: "joindevops"
  tasks:
  - name: convert to lower case
    ansible.builtin.debug:
      msg: "convert into upper case: {{ institute | upper }}"
