- name: play level variables
  hosts: local
  connection: local #ansible is connecting to local host
  vars:
    course: DEVSECOPS
    duration: 4-months
    trainer: SHIVA
  tasks:
  - name: print the course info
    ansible.builtin.debug:
      msg: "course name is: {{ course }} and duration is: {{ duration }} and trainer is: {{ trainer }}"
    