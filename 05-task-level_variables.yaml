- name: Play level variables ..
  hosts: localhost
  connection: local
  vars:
    course: "DEVOPS with AWS"
    duration: "2 days"
    trainer: "Shiva Kumar"
  tasks:
  - name: Display course details
    vars:
      course: "Ansible for Beginners"
    ansible.builtin.debug:
      msg: "Course: {{ course }}, Duration: {{ duration }}, Trainer: {{ trainer }}"